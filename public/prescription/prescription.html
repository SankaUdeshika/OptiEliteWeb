<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARES Prescription</title>
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #e8e4de;
        font-family: "EB Garamond", Georgia, serif;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        padding: 40px 20px;
      }

      .page {
        background: #fff;
        width: 660px;
        min-height: 900px;
        padding: 36px 44px 44px;
        box-shadow:
          0 8px 40px rgba(0, 0, 0, 0.13),
          0 1px 4px rgba(0, 0, 0, 0.07);
        position: relative;
      }

      /* ── HEADER ── */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding-bottom: 18px;
        border-bottom: 1.5px solid #222;
      }

      .logo-block {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .logo-wordmark {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* Eye icons */
      .eye-icons {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .eye-svg {
        width: 38px;
        height: 22px;
      }

      .brand-name {
        font-family: "Playfair Display", serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.18em;
        color: #1a1a1a;
        line-height: 1;
      }

      .brand-tagline {
        font-family: "DM Mono", monospace;
        font-size: 8px;
        letter-spacing: 0.22em;
        color: #c0392b;
        text-transform: uppercase;
        margin-top: 3px;
        padding-left: 2px;
      }

      .prescription-block {
        text-align: right;
      }

      .prescription-title {
        font-family: "Playfair Display", serif;
        font-size: 22px;
        font-weight: 700;
        color: #1a1a1a;
        letter-spacing: 0.04em;
      }

      .prescription-meta {
        margin-top: 8px;
        font-family: "DM Mono", monospace;
        font-size: 11px;
        color: #444;
        line-height: 1.8;
      }
      .prescription-meta span {
        color: #1a1a1a;
        font-weight: 500;
      }

      /* ── ADDRESS ── */
      .address-block {
        margin-top: 16px;
        font-family: "DM Mono", monospace;
        font-size: 10.5px;
        color: #555;
        line-height: 1.7;
        border-bottom: 1px solid #ddd;
        padding-bottom: 14px;
      }

      /* ── PATIENT ── */
      .patient-block {
        margin-top: 14px;
        padding-bottom: 14px;
        border-bottom: 1px dashed #ccc;
      }
      .patient-name {
        font-family: "Playfair Display", serif;
        font-size: 17px;
        font-weight: 700;
        color: #1a1a1a;
      }
      .patient-numbers {
        font-family: "DM Mono", monospace;
        font-size: 11px;
        color: #666;
        margin-top: 4px;
        line-height: 1.6;
      }

      /* ── Rx symbol ── */
      .rx-symbol {
        margin-top: 12px;
        font-family: "EB Garamond", serif;
        font-style: italic;
        font-size: 26px;
        color: #c0392b;
        border: 2px solid #c0392b;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 36px;
        border-radius: 4px;
      }

      /* ── EYE DIALS ── */
      .dials-row {
        display: flex;
        justify-content: center;
        gap: 48px;
        margin: 28px 0 18px;
      }

      .dial-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .dial-label {
        font-family: "Playfair Display", serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #1a1a1a;
      }

      /* SVG dial */
      .dial-svg {
        width: 160px;
        height: 90px;
      }

      /* separator between dials */
      .dial-separator {
        display: flex;
        align-items: center;
        padding-top: 40px;
      }
      .dial-sep-line {
        width: 1px;
        height: 28px;
        background: #999;
      }
      .dial-sep-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #555;
        margin: 4px 0;
      }

      /* ── TABLE ── */
      .rx-table-wrapper {
        margin-top: 18px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-family: "DM Mono", monospace;
      }

      thead tr {
        background: #1a1a1a;
        color: #fff;
      }

      thead th {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.1em;
        padding: 9px 0;
        text-align: center;
        border: 1px solid #333;
      }

      tbody tr:nth-child(even) {
        background: #f5f3f0;
      }
      tbody tr:nth-child(odd) {
        background: #ffffff;
      }

      tbody td {
        font-size: 13px;
        text-align: center;
        padding: 10px 6px;
        border: 1px solid #ccc;
        color: #1a1a1a;
      }

      /* Row label cell */
      td.row-label {
        background: #1a1a1a;
        color: #fff;
        font-size: 11px;
        letter-spacing: 0.08em;
        font-weight: 500;
        width: 28px;
      }

      /* ── SIGNATURE ── */
      .signature-row {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 12px;
        margin-top: 48px;
        padding-top: 12px;
      }

      .sig-label {
        font-family: "EB Garamond", serif;
        font-size: 12px;
        font-style: italic;
        color: #666;
      }

      .sig-dots {
        font-family: "DM Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.16em;
        color: #aaa;
        flex: 1;
        max-width: 220px;
        border-bottom: 1px dotted #aaa;
        height: 1px;
        align-self: flex-end;
        margin-bottom: 2px;
      }

      /* ── THANK YOU FOOTER ── */
      .footer {
        margin-top: 36px;
        background: #e8e4de;
        text-align: center;
        padding: 14px;
        border-radius: 2px;
      }

      .footer-text {
        font-family: "Playfair Display", serif;
        font-style: italic;
        font-size: 16px;
        font-weight: 700;
        color: #1a1a1a;
        letter-spacing: 0.06em;
      }
    </style>
  </head>
  <body onload="fetchViewPrescriptionPage()">

              <!-- 90° = top -->

              <!-- 80° -->

              <!-- 70° -->
              <line x1="104" y1="22.0" x2="100.6" y2="30.2" />

              <!-- 10° -->
              <line x1="148.8" y1="75.8" x2="141.1" y2="77.2" />
              <!-- 0° = right -->
              <line x1="150" y1="88" x2="142" y2="88" />
            </g>
            <!-- Labels -->
            <g
              font-family="monospace"
              font-size="7"
              fill="#333"
              text-anchor="middle"
            >
              <text x="8" y="84">180</text>
              <text x="10" y="72">170</text>
              <text x="14" y="60">160</text>
              <text x="21" y="49">150</text>
              <text x="28" y="39">140</text>
              <text x="36" y="30">130</text>
              <text x="45" y="22">120</text>
              <text x="56" y="17">110</text>
              <text x="68" y="12">100</text>
              <text x="80" y="10">90</text>
              <text x="92" y="12">80</text>
              <text x="104" y="17">70</text>
              <text x="115" y="22">60</text>
              <text x="124" y="30">50</text>
              <text x="132" y="39">40</text>
              <text x="139" y="49">30</text>
              <text x="146" y="60">20</text>
              <text x="150" y="72">10</text>
              <text x="152" y="84">0</text>

              stroke-dasharray="2,2"

            <!-- Label -->

              font-weight="700"
              fill="#1a1a1a"

        <!-- separator -->

            <tr>
              <th>RX</th>
              <th>SPH.</th>
              <th>CYL.</th>
              <th>AXIS.</th>
